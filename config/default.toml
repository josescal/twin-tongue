schema_version = 2

[audio]
sample_format = "int16"
frame_duration_ms = 20
device_poll_interval_seconds = 5.0
# Keep the physical microphone in the Windows shared graph so Realtek input
# gain and processing match the native Windows microphone test.
# CABLE A/B also remain shared with the calling application.
physical_capture_exclusive_mode = false

[audio.resampling]
engine = "soxr"
quality = "HQ"

[audio.aec3]
enabled = true
stream_delay_ms = 0
render_queue_capacity_blocks = 100

[audio.virtual_cables.session_monitor]
poll_interval_seconds = 1.0
failure_grace_seconds = 5.0

[pipeline.runtime.remote_to_agent]
enabled = true
mode = "passthrough"
type = "speech_to_speech"
# This selection skips the Classic Silero VAD during application startup.

[pipeline.runtime.remote_to_agent.audio]
input_sample_rate = 48000
input_channels = 2
output_sample_rate = 48000
output_channels = 1

[pipeline.runtime.agent_to_remote]
enabled = true
mode = "passthrough"
type = "speech_to_speech"
# This selection skips the Classic Silero VAD during application startup.

[pipeline.runtime.agent_to_remote.audio]
input_sample_rate = 48000
input_channels = 2
output_sample_rate = 48000
output_channels = 2

[pipeline.classic.defaults]
stt_max_audio_catchup_ms = 100

[pipeline.classic.defaults.retry]
max_attempts = 2
base_delay_seconds = 0.75

[pipeline.classic.defaults.vad]
engine = "silero"

[pipeline.classic.defaults.vad.silero]
runtime = "onnx"
opset_version = 16

[pipeline.classic.defaults.stt]
engine = "elevenlabs"

[pipeline.classic.defaults.stt.elevenlabs]
model = "scribe_v2_realtime"
audio_format = "pcm_16000"
sample_rate = 16000
include_timestamps = true
no_verbatim = true
keyterms = []
send_chunk_duration_ms = 100
queue_capacity_blocks = 50
idle_keepalive_seconds = 5.0

[pipeline.classic.defaults.stt.elevenlabs.audio_capture]
enabled = true
directory = "logs/stt-audio"
max_seconds_per_file = 120.0
# Enable only for detailed timing analysis; it creates an additional JSONL file.
write_timing_marks = false
# Batch small blocks to reduce filesystem and antivirus overhead.
write_buffer_kb = 64
flush_interval_seconds = 1.0

[pipeline.classic.defaults.translation]
engine = "google_translate_v2"

[pipeline.classic.defaults.translation.google_translate_v2]
endpoint = "https://translation.googleapis.com/language/translate/v2"
format = "text"

[pipeline.classic.defaults.tts]
engine = "elevenlabs"

[pipeline.classic.defaults.tts.elevenlabs]
model = "eleven_flash_v2_5"
voice_id = "851ejYcv2BoNPjrkw93G"
output_format = "pcm_16000"
sample_rate = 16000
speed = 1.1

[pipeline.classic.defaults.tts.elevenlabs.language_voices]
en = { male = "JBFqnCBsd6RMkjVDRZzb", female = "LudcwvHIZaqQOcQfVZSY" }
fr = { male = "aQROLel5sQbj1vuIVi6B", female = "LudcwvHIZaqQOcQfVZSY" }
es = { male = "851ejYcv2BoNPjrkw93G", female = "LudcwvHIZaqQOcQfVZSY" }
ca = { male = "851ejYcv2BoNPjrkw93G", female = "LudcwvHIZaqQOcQfVZSY" }

[pipeline.classic.defaults.tts.elevenlabs.language_models]
ca = "eleven_v3"

[pipeline.classic.remote_to_agent]
voice_gender = "male"

[pipeline.classic.remote_to_agent.latency_protection]
enabled = true
playback_backlog_discard_age_seconds = 8.0
segment_discard_age_seconds = 15.0
playback_backlog_segments_to_keep = 2

[pipeline.classic.remote_to_agent.vad]
engine = "silero"

[pipeline.classic.remote_to_agent.vad.silero]
threshold = 0.50
negative_threshold = 0.35
min_speech_duration_ms = 100
min_silence_duration_ms = 350
speech_pad_ms = 100

[pipeline.classic.remote_to_agent.segmentation]
engine = "adaptive"

[pipeline.classic.remote_to_agent.segmentation.adaptive]
minimum_segment_duration_ms = 1500
preferred_segment_duration_ms = 2500
short_pause_duration_ms = 150
partial_boundary_stability_ms = 200
maximum_segment_duration_ms = 5000

[pipeline.classic.remote_to_agent.stt]
engine = "elevenlabs"

[pipeline.classic.remote_to_agent.translation]
engine = "google_translate_v2"

[pipeline.classic.remote_to_agent.tts]
engine = "elevenlabs"

[pipeline.classic.agent_to_remote]
voice_gender = "male"

[pipeline.classic.agent_to_remote.latency_protection]
enabled = true
playback_backlog_discard_age_seconds = 8.0
segment_discard_age_seconds = 15.0
playback_backlog_segments_to_keep = 2

[pipeline.classic.agent_to_remote.vad]
engine = "silero"

[pipeline.classic.agent_to_remote.vad.silero]
threshold = 0.70
negative_threshold = 0.50
min_speech_duration_ms = 200
min_silence_duration_ms = 250
speech_pad_ms = 100

[pipeline.classic.agent_to_remote.segmentation]
engine = "adaptive"

[pipeline.classic.agent_to_remote.segmentation.adaptive]
minimum_segment_duration_ms = 2200
preferred_segment_duration_ms = 2500
short_pause_duration_ms = 150
partial_boundary_stability_ms = 350
maximum_segment_duration_ms = 5000

[pipeline.classic.agent_to_remote.stt]
engine = "elevenlabs"

[pipeline.classic.agent_to_remote.translation]
engine = "google_translate_v2"

[pipeline.classic.agent_to_remote.tts]
engine = "elevenlabs"

[pipeline.speech_to_speech.defaults.translation]
engine = "openai_realtime"

[pipeline.speech_to_speech.defaults.translation.openai_realtime]
endpoint = "wss://api.openai.com/v1/realtime/translations"
model = "gpt-realtime-translate"
sample_rate = 24000
send_chunk_duration_ms = 200
input_queue_capacity_blocks = 25
send_queue_capacity_frames = 3
received_queue_capacity_blocks = 150
playback_queue_capacity_blocks = 12
reconnect_max_attempts = 5
reconnect_base_delay_seconds = 0.5
reconnect_cooldown_seconds = 10.0
session_setup_timeout_seconds = 10.0
close_timeout_seconds = 5.0
metrics_interval_seconds = 10.0
log_transcript_deltas = false
transcript_ui_update_interval_ms = 150
transcript_segment_idle_ms = 1500
transcript_alignment_wait_ms = 5000
provider_delay_warning_ms = 3000
provider_delay_recovery_ms = 1500
output_gain_db = 0.0

[pipeline.speech_to_speech.defaults.translation.openai_realtime.adaptive_playout]
enabled = true
target_backlog_ms = 1000.0
accelerated_backlog_ms = 2000.0
emergency_backlog_ms = 2800.0
recovery_backlog_ms = 1500.0
moderate_speed = 1.10
maximum_speed = 1.15
silence_search_ms = 250.0
silence_threshold_dbfs = -42.0
crossfade_ms = 15.0

[pipeline.speech_to_speech.defaults.translation.openai_realtime.input_transcription]
enabled = true
model = "gpt-realtime-whisper"

[pipeline.speech_to_speech.defaults.translation.openai_realtime.audio_capture]
# Disabled for normal operation. When enabled (or started from the control panel),
# only the selected tracks are written. "captured" is the source endpoint audio
# and "played" is the final signal emitted after translation and local playout.
# Both use one shared timeline so they can be imported together into Audacity.
# Use the control-panel button for a controlled diagnostic call. Set this true
# only when capture must start automatically with the Realtime pipeline.
enabled = false
directory = "logs/realtime-audio"
max_seconds_per_file = 120.0
tracks = ["captured", "played"]
write_timing_marks = false
queue_capacity_blocks = 500
write_buffer_kb = 64
flush_interval_seconds = 1.0

[pipeline.speech_to_speech.defaults.translation.openai_realtime.session_gate]
enabled = true
prewarm_session = true
disconnect_grace_seconds = 5.0

[pipeline.speech_to_speech.remote_to_agent.translation]
engine = "openai_realtime"

[pipeline.speech_to_speech.agent_to_remote.translation]
engine = "openai_realtime"

[pipeline.speech_to_speech.agent_to_remote.translation.openai_realtime]
# CABLE B was roughly 9.5 dB below the bot track in the 08:48 support call.
# +6 dB improves bot-side detectability while retaining measured peak headroom.
output_gain_db = 6.0

[observability.logging]
level = "INFO"
file_enabled = true
file = "logs/twin-tongue.log"
max_size_mb = 5
max_files = 5
queue_capacity = 1000
file_flush_interval_seconds = 5.0

[observability.metrics]
enabled = true
file = "logs/metrics.csv"
retention_days = 14
interval_seconds = 60.0

[control_server]
enabled = true
host = "127.0.0.1"
port = 8765
